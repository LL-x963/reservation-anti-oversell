# ============================================================
# 生产环境配置
# 启动方式：SPRING_PROFILES_ACTIVE=prod
# 所有连接信息与密钥必须由环境变量注入，不提供任何默认值
# ============================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${PETHOME_MYSQL_URL}
    username: ${PETHOME_MYSQL_USERNAME}
    password: ${PETHOME_MYSQL_PASSWORD}
    hikari:
      minimum-idle: ${PETHOME_MYSQL_MIN_IDLE:5}
      maximum-pool-size: ${PETHOME_MYSQL_POOL_SIZE:20}
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${PETHOME_REDIS_HOST}
      port: ${PETHOME_REDIS_PORT:6379}
      database: ${PETHOME_REDIS_DATABASE:0}
      password: ${PETHOME_REDIS_PASSWORD}
      timeout: 3000ms
  rabbitmq:
    host: ${PETHOME_RABBITMQ_HOST}
    port: ${PETHOME_RABBITMQ_PORT:5672}
    username: ${PETHOME_RABBITMQ_USERNAME}
    password: ${PETHOME_RABBITMQ_PASSWORD}
    virtual-host: ${PETHOME_RABBITMQ_VHOST:/}
    connection-timeout: 3000
    publisher-confirm-type: correlated
    publisher-returns: true

pethome:
  jwt:
    secret: ${PETHOME_JWT_SECRET:}
  knowledge:
    base-url: ${PETHOME_RAG_BASE_URL:http://127.0.0.1:8000}
    # 与 rag-service 的 RAG_API_KEY 保持一致，缺失则启动失败
    api-key: ${PETHOME_RAG_API_KEY:}
  auth:
    # 生产禁止 openid 直登（即使环境变量误设为 true，启动自检也会拒绝）
    allow-openid-direct-login: false
  security:
    allow-insecure-dev-config: false
    # 必须显式配置前端域名，逗号分隔；留空或包含 * 会导致启动失败
    cors-allowed-origins: ${PETHOME_CORS_ALLOWED_ORIGINS:}

logging:
  file:
    path: ${PETHOME_LOG_DIR:./logs}
  level:
    com.pethome: info
