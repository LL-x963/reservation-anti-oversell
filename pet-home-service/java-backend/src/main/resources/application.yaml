server:
  port: ${SERVER_PORT:8080}
  # 优雅停机：等在途请求处理完再退出，避免发布时接口 502
  shutdown: graceful

spring:
  application:
    name: pet-home
  # 未显式指定 profile 时使用 dev（本地开发 / 自动化测试）；
  # 生产必须显式设置 SPRING_PROFILES_ACTIVE=prod，由启动自检拒绝不安全的默认值。
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # ---------------- 数据库迁移 ----------------
  # 生产空库直接执行 V1；已存在的库通过 baseline 对齐，不会重复建表或删数据
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true

  # ---------------- RabbitMQ 消费端 ----------------
  # 失败重试 3 次（指数退避），仍失败则由 RepublishMessageRecoverer 转发到死信队列 order.dlq.queue
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        concurrency: 1
        max-concurrency: 4
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 10000ms

# ---------------- 健康检查 ----------------
# 仅暴露 health / info，且不返回依赖细节，供负载均衡与监控探活使用
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# ---------------- MyBatis-Plus ----------------
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.pethome.entity
  configuration:
    map-underscore-to-camel-case: true
    # 生产默认不打印全量 SQL；dev profile 覆盖为 StdOutImpl
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# ---------------- 业务配置 ----------------
pethome:
  jwt:
    # 生产必须通过 PETHOME_JWT_SECRET 注入，长度 ≥ 32 字节，缺失则启动失败
    secret: ${PETHOME_JWT_SECRET:}
    expire-seconds: ${PETHOME_JWT_EXPIRE_SECONDS:86400}
    header: Authorization
    token-prefix: "Bearer "
  mq:
    delayed-enabled: ${PETHOME_MQ_DELAYED_ENABLED:true}
  order:
    cancel-delay-millis: ${PETHOME_ORDER_CANCEL_DELAY_MILLIS:1800000}
  payment:
    # 支付渠道：mock 模拟渠道 / wechat 微信支付 / alipay 支付宝
    channel: ${PETHOME_PAYMENT_CHANNEL:mock}
    # 生产默认禁止模拟支付；未接入真实渠道时必须显式开启，启动时会打印告警
    allow-mock-payment: ${PETHOME_PAYMENT_ALLOW_MOCK:false}
    # 回调验签密钥；mock 渠道使用 HMAC-SHA256(原始报文, secret)
    callback-secret: ${PETHOME_PAYMENT_CALLBACK_SECRET:}
    prepay-expire-minutes: ${PETHOME_PAYMENT_PREPAY_EXPIRE_MINUTES:30}
    # 对账任务执行间隔（毫秒）
    reconcile-interval-millis: ${PETHOME_PAYMENT_RECONCILE_INTERVAL:300000}
    reconcile-initial-delay-millis: ${PETHOME_PAYMENT_RECONCILE_INITIAL_DELAY:60000}
  knowledge:
    enabled: ${PETHOME_RAG_ENABLED:true}
    base-url: ${PETHOME_RAG_BASE_URL:http://localhost:8000}
    api-key: ${PETHOME_RAG_API_KEY:}
    api-key-header: X-API-Key
    connect-timeout: 3s
    read-timeout: 30s
    reindex-read-timeout: 5m
    max-retries: 1
  upload:
    # local：本地磁盘；oss：对象存储（已预留接口，未接入时启动即失败，不会静默降级）
    storage-type: ${PETHOME_UPLOAD_STORAGE_TYPE:local}
    base-dir: ${PETHOME_UPLOAD_BASE_DIR:./upload}
    url-prefix: /upload/
    max-size: 5242880
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
      - webp
  auth:
    # 仅本地开发 / 自动化测试使用：允许直接传 openid 登录。
    # 生产必须为 false（prod profile 固定 false，且启动自检会拒绝开启）。
    allow-openid-direct-login: ${PETHOME_AUTH_ALLOW_OPENID_DIRECT_LOGIN:false}
    # 登录失败锁定：连续失败 N 次锁定 M 分钟
    max-fail-count: ${PETHOME_AUTH_MAX_FAIL_COUNT:5}
    lock-minutes: ${PETHOME_AUTH_LOCK_MINUTES:15}
    # 登录接口限流：同一 IP 每分钟最大尝试次数
    rate-limit-per-minute: ${PETHOME_AUTH_RATE_LIMIT_PER_MINUTE:20}
  wechat:
    # 小程序登录：appid / secret 任一为空时，code 登录入口直接禁用（不会退化为信任客户端 openid）
    appid: ${PETHOME_WECHAT_APPID:}
    secret: ${PETHOME_WECHAT_SECRET:}
    code2session-url: ${PETHOME_WECHAT_CODE2SESSION_URL:https://api.weixin.qq.com/sns/jscode2session}
    connect-timeout: 3s
    read-timeout: 5s
  security:
    # true 时跳过生产安全自检（仅限本地 / 测试）。prod profile 下必须为 false。
    allow-insecure-dev-config: ${PETHOME_ALLOW_INSECURE_DEV_CONFIG:false}
    # 允许跨域的来源，逗号分隔；* 仅限开发
    cors-allowed-origins: ${PETHOME_CORS_ALLOWED_ORIGINS:}

logging:
  level:
    root: info
    com.pethome: info
