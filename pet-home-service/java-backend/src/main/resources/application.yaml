server:
  port: 8080

spring:
  application:
    name: pet-home

  # ---------------- 文件上传 ----------------
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  # ---------------- MySQL ----------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pet_home?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ---------------- Redis ----------------
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      # 本地 Redis（E:\Redis\redis.windows.conf 中 requirepass 123456）
      password: 123456
      timeout: 5000ms

  # ---------------- RabbitMQ ----------------
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 5000
    # 开启发送方确认与路由失败回调
    publisher-confirm-type: correlated
    publisher-returns: true

  # ---------------- Jackson ----------------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# ---------------- MyBatis-Plus ----------------
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.pethome.entity
  configuration:
    # 下划线转驼峰
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 主键自增（配合实体上的 @TableId(type = IdType.AUTO)）
      id-type: auto

# ---------------- 自定义配置 ----------------
pethome:
  jwt:
    # 生产环境请通过环境变量 PETHOME_JWT_SECRET 覆盖，长度不得少于 32 字节（HS256 要求）
    secret: ${PETHOME_JWT_SECRET:pethome-jwt-secret-key-please-change-me-in-production-2024}
    # token 有效期：24 小时（单位：秒）
    expire-seconds: 86400
    header: Authorization
    token-prefix: "Bearer "
  mq:
    # 延迟交换机依赖 rabbitmq_delayed_message_exchange 插件，插件不可用时置为 false 即可正常启动
    delayed-enabled: true
  order:
    # 待支付超时自动取消延迟（毫秒），默认 30 分钟
    cancel-delay-millis: 1800000
  knowledge:
    # RAG 知识库问答服务地址（pet-home-service/rag-service）
    base-url: http://localhost:8000
    # 与 rag-service 的 RAG_API_KEY 保持一致，通过请求头 X-API-Key 传递
    api-key: ${PETHOME_RAG_API_KEY:pethome-rag-key}
    api-key-header: X-API-Key
    # 连接超时（需求：3 秒）
    connect-timeout: 3s
    # 问答读取超时（本地 1.5B 模型推理通常 2-10 秒，留足余量）
    read-timeout: 30s
    # 重建索引读取超时（需向量化全部文档，明显长于问答）
    reindex-read-timeout: 5m
    # 调用失败重试次数（不含首次调用）
    max-retries: 1
  upload:
    # 本地文件存储目录（相对服务启动目录），WebMvcConfig 会将其映射为静态资源
    base-dir: ./upload
    url-prefix: /upload/
    # 单文件大小上限（字节），5MB
    max-size: 5242880
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
      - webp

logging:
  level:
    com.pethome: debug
